<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container d-flex justify-content-center align-items-center vh-100 login-iniciarsesion">
        <div class="form-container text-center p-4">

            <h2 class="mb-4">Iniciar sesión</h2>

            <form onsubmit="event.preventDefault(); window.location.href='index.html';">

                <div class="mb-3 text-start">
                    <label class="form-label">Correo electrónico</label>
                    <input type="gmail" class="form-control" placeholder="Ej: usuario@gmail.com" required>
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label">Contraseña</label>
                    <input type="password" class="form-control" placeholder="********" required>
                </div>

                <button class="btn btn-minecraft w-100 mt-3">Entrar</button>
            </form>

            <a href="#" class="mt-2 d-block">¿Olvidaste tu contraseña?</a>
            <br>
            <a href="crear_cuenta.html" class="d-block mt-3 link-volver">Crear cuenta</a>
            <a href="index.html" class="d-block link-volver">Volver al inicio</a>

        </div>
    </div>

</body>
</html>
