<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="Imagenes/fondoc.png">
    <title>Minecraft</title>
</head>

<body>

    <header>
        <img src="Imagenes/logo.png" class="logo">
    </header>

    <div class="text-center mt-4">
        <div class="btn-group" role="group">
            <a href="index.html" class="btn btn-outline-primary">Inicio</a>
            <a href="#noticias" class="btn btn-outline-primary">Noticias</a>
            <a href="iniciar_sesion.html" class="btn btn-outline-primary">Iniciar sesión</a>
            <a href="crear_cuenta.html" class="btn btn-outline-primary">Crear cuenta</a>
        </div>
    </div>

    <div class="my-4"></div>

    <div id="carouselExampleCaptions" class="carousel slide container">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2"></button>
        </div>

        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="Imagenes/overworld carrucel.png" class="d-block w-100" alt="Overworld">
                <div class="carousel-caption d-none d-md-block">
                    <h5>Overworld</h5>
                    <p>Construye y explora este maravilloso mundo.</p>
                </div>
            </div>

            <div class="carousel-item">
                <img src="Imagenes/nedert carrucel.png" class="d-block w-100" alt="Nether">
                <div class="carousel-caption d-none d-md-block">
                    <h5>Nether</h5>
                    <p>Un mundo nuevo que te ayudará a avanzar en tu aventura.</p>
                </div>
            </div>

            <div class="carousel-item">
                <img src="Imagenes/end carrucel.jpg" class="d-block w-100" alt="End">
                <div class="carousel-caption d-none d-md-block">
                    <h5>End</h5>
                    <p>Explora el fin del mundo custodiado por una gran bestia.</p>
                </div>
            </div>
        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions"
            data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions"
            data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>

    <h1>Descubre nuestros juegos</h1>
    <div class="container text-center">
        <div class="row">
            <div class="col"><img src="Imagenes/juego 1.1.png" class="img-small espacio"></div>
            <div class="col"><img src="Imagenes/juego 2.2.png" class="img-small espacio"></div>
            <div class="col"><img src="Imagenes/juego 3.3.png" class="img-small espacio"></div>
            <div class="col"><img src="Imagenes/juego 4.4.png" class="img-small espacio"></div>
        </div>
    </div>

    <h1 id="noticias">Noticias más recientes</h1>
    <div class="container text-center">
        <div class="row">
            <div class="col"><img src="Imagenes/noticia 1.png" class="img-small espacio1"></div>
            <div class="col"><img src="Imagenes/noticia 2.png" class="img-small espacio1"></div>
            <div class="col"><img src="Imagenes/noticia 3.png" class="img-small espacio1"></div>
            <div class="col"><img src="Imagenes/noticia 4.png" class="img-small espacio1"></div>
            <div class="col"><img src="Imagenes/noticia 5.png" class="img-small espacio1"></div>
            <div class="col"><img src="Imagenes/noticia 6.png" class="img-small espacio1"></div>
            <div class="col"><img src="Imagenes/noticia 7.png" class="img-small espacio1"></div>
            <div class="col"><img src="Imagenes/noticia 8.png" class="img-small espacio1"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
